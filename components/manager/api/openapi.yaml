components:
  schemas:
    ConnectionInput:
      additionalProperties: false
      properties:
        configName:
          description: Unique configuration name used to reference this connection.
          examples:
            - production-db
          type: string
        databaseName:
          description: Database name to connect to.
          examples:
            - mydatabase
          type: string
        host:
          description: Database server hostname or IP address.
          examples:
            - db.example.com
          type: string
        metadata:
          additionalProperties: {}
          description: Optional application-defined connection metadata.
          examples:
            - environment: production
              region: us-east-1
          type: object
        password:
          description: Database authentication password.
          examples:
            - secretpassword
          type: string
        port:
          description: Database server TCP port.
          examples:
            - 5432
          format: int64
          type: integer
        schema:
          description: Optional default database schema.
          examples:
            - public
          type: string
        ssl:
          $ref: "#/components/schemas/SSLInput"
          description: Optional SSL/TLS connection settings.
          examples:
            - ca: certificate-authority
              mode: require
        type:
          description: Database engine type.
          examples:
            - POSTGRESQL
          type: string
        userName:
          description: Database authentication username.
          examples:
            - dbuser
          type: string
      required:
        - configName
        - type
        - host
        - port
        - databaseName
        - userName
        - password
      type: object
    ConnectionPage:
      additionalProperties: false
      properties:
        items:
          description: Connections returned for this page.
          examples:
            - - configName: production-db
                createdAt: "2026-01-15T10:30:00Z"
                databaseName: mydatabase
                host: db.example.com
                id: 018f47a6-3e5f-7b9a-8c1d-2e3f4a5b6c7d
                metadata:
                  environment: production
                  region: us-east-1
                port: 5432
                productName: midaz
                schema: public
                ssl:
                  mode: require
                type: POSTGRESQL
                updatedAt: "2026-01-16T14:45:00Z"
                userName: dbuser
          items:
            $ref: "#/components/schemas/ConnectionResponse"
          type:
            - array
            - "null"
        limit:
          description: Maximum items returned per page.
          examples:
            - 10
          format: int64
          type: integer
        page:
          description: Current page number.
          examples:
            - 1
          format: int64
          type: integer
        total:
          description: Total matching connections.
          examples:
            - 10
          format: int64
          type: integer
      required:
        - items
        - limit
        - total
      type: object
    ConnectionResponse:
      additionalProperties: false
      properties:
        configName:
          description: Configuration name used to reference the connection.
          examples:
            - production-db
          type: string
        createdAt:
          description: Timestamp when the connection was created.
          examples:
            - "2026-01-15T10:30:00Z"
          format: date-time
          type: string
        databaseName:
          description: Connected database name.
          examples:
            - mydatabase
          type: string
        host:
          description: Database server hostname or IP address.
          examples:
            - db.example.com
          type: string
        id:
          description: Unique connection identifier.
          examples:
            - 018f47a6-3e5f-7b9a-8c1d-2e3f4a5b6c7d
          type: string
        metadata:
          additionalProperties: {}
          description: Application-defined connection metadata.
          examples:
            - environment: production
              region: us-east-1
          type: object
        port:
          description: Database server TCP port.
          examples:
            - 5432
          format: int64
          type: integer
        productName:
          description: Product that owns the connection.
          examples:
            - midaz
          type: string
        schema:
          description: Default database schema, when configured.
          examples:
            - public
          type: string
        ssl:
          $ref: "#/components/schemas/SSLResponse"
          description: Configured SSL/TLS settings with secrets omitted.
          examples:
            - mode: require
        type:
          description: Database engine type.
          examples:
            - POSTGRESQL
          type: string
        updatedAt:
          description: Timestamp when the connection was last updated.
          examples:
            - "2026-01-16T14:45:00Z"
          format: date-time
          type: string
        userName:
          description: Database authentication username.
          examples:
            - dbuser
          type: string
      required:
        - id
        - configName
        - type
        - host
        - port
        - databaseName
        - userName
        - createdAt
        - updatedAt
      type: object
    ConnectionSchemaResponse:
      additionalProperties: false
      properties:
        configName:
          description: Configuration name used to reference the connection.
          examples:
            - production-db
          type: string
        databaseName:
          description: Database whose schema was discovered.
          examples:
            - mydatabase
          type: string
        id:
          description: Unique connection identifier.
          examples:
            - 018f47a6-3e5f-7b9a-8c1d-2e3f4a5b6c7d
          type: string
        tables:
          description: Discovered tables or collections and their fields.
          examples:
            - - fields:
                  - id
                  - name
                  - created_at
                name: public.accounts
          items:
            $ref: "#/components/schemas/TableDetails"
          type:
            - array
            - "null"
        type:
          description: Database engine type.
          examples:
            - POSTGRESQL
          type: string
      required:
        - id
        - configName
        - databaseName
        - type
        - tables
      type: object
    ConnectionTestResponse:
      additionalProperties: false
      properties:
        latencyMs:
          description: Round-trip connection latency in milliseconds.
          examples:
            - 18
          format: int64
          type: integer
        message:
          description: Human-readable connectivity test result.
          examples:
            - Connection established successfully
          type: string
        status:
          description: Connectivity test outcome.
          examples:
            - success
          type: string
      required:
        - status
        - message
        - latencyMs
      type: object
    ConnectionUpdateInput:
      additionalProperties: false
      properties:
        configName:
          description: New configuration name for the connection.
          examples:
            - production-db
          type: string
        databaseName:
          description: New database name to connect to.
          examples:
            - mydatabase
          type: string
        host:
          description: New database server hostname or IP address.
          examples:
            - db.example.com
          type: string
        metadata:
          additionalProperties: {}
          description: Application-defined metadata that replaces the current metadata.
          examples:
            - environment: production
              region: us-east-1
          type: object
        password:
          description: New database authentication password.
          examples:
            - secretpassword
          type: string
        port:
          description: New database server TCP port.
          examples:
            - 5432
          format: int64
          type: integer
        schema:
          description: New default database schema.
          examples:
            - public
          type: string
        ssl:
          $ref: "#/components/schemas/SSLUpdateInput"
          description: SSL/TLS settings to update.
          examples:
            - mode: verify-full
        type:
          description: New database engine type.
          examples:
            - POSTGRESQL
          type: string
        userName:
          description: New database authentication username.
          examples:
            - dbuser
          type: string
      type: object
    DataRequest:
      additionalProperties: false
      properties:
        filters:
          additionalProperties:
            additionalProperties:
              additionalProperties:
                $ref: "#/components/schemas/FilterCondition"
              type: object
            type: object
          description: Optional filter conditions grouped by data source, table, and field.
          examples:
            - ledger:
                transactions:
                  status:
                    eq:
                      - approved
          type: object
        mappedFields:
          additionalProperties:
            additionalProperties:
              items:
                type: string
              type:
                - array
                - "null"
            type: object
          description: Fields to extract, grouped by data source and table.
          examples:
            - ledger:
                transactions:
                  - id
                  - amount
          type: object
      required:
        - mappedFields
      type: object
    Detail:
      additionalProperties: false
      properties:
        code:
          description: "Stable, machine-readable domain error code scoped to the emitting service (format: <SERVICE>-NNNN)."
          examples:
            - ERR-0001
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    FetcherRequest:
      additionalProperties: false
      properties:
        dataRequest:
          $ref: "#/components/schemas/DataRequest"
          description: Fields and filters to extract from configured data sources.
          examples:
            - mappedFields:
                ledger:
                  transactions:
                    - id
                    - amount
        metadata:
          additionalProperties: {}
          description: Caller-defined metadata stored with the job; source identifies the owning product.
          examples:
            - correlationId: settlement-2026-07-13
              source: payments
          properties:
            source:
              description: Owning product used for notification routing and connection ownership validation.
              examples:
                - payments
              type: string
          required:
            - source
          type: object
      required:
        - dataRequest
        - metadata
      type: object
    FetcherResponse:
      additionalProperties: false
      properties:
        createdAt:
          description: UTC timestamp when the job was created.
          examples:
            - "2026-07-13T12:00:00Z"
          format: date-time
          type: string
        jobId:
          description: Unique identifier of the extraction job.
          examples:
            - 01980a89-21f0-7d7e-a109-564b5c6f53ac
          type: string
        message:
          description: Outcome of the create request.
          examples:
            - Job created and queued for processing
          type: string
        status:
          description: Current processing status of the job.
          examples:
            - pending
          type: string
      required:
        - jobId
        - status
        - createdAt
        - message
      type: object
    FilterCondition:
      additionalProperties: false
      properties:
        between:
          description: Inclusive lower and upper bounds for the field.
          examples:
            - - 100
              - 1000
          items: {}
          type:
            - array
            - "null"
        eq:
          description: Values that the field may equal.
          examples:
            - - active
              - pending
          items: {}
          type:
            - array
            - "null"
        gt:
          description: Single value that the field must be greater than.
          examples:
            - - 100
          items: {}
          type:
            - array
            - "null"
        gte:
          description: Single value that the field must be greater than or equal to.
          examples:
            - - "2025-06-01"
          items: {}
          type:
            - array
            - "null"
        in:
          description: Values that the field may match.
          examples:
            - - active
              - pending
              - suspended
          items: {}
          type:
            - array
            - "null"
        like:
          description: Single LIKE pattern that the field must match.
          examples:
            - - "%active%"
          items: {}
          type:
            - array
            - "null"
        lt:
          description: Single value that the field must be less than.
          examples:
            - - 1000
          items: {}
          type:
            - array
            - "null"
        lte:
          description: Single value that the field must be less than or equal to.
          examples:
            - - "2025-06-30"
          items: {}
          type:
            - array
            - "null"
        ne:
          description: Single value that the field must not equal.
          examples:
            - - active
          items: {}
          type:
            - array
            - "null"
        nin:
          description: Values that the field must not match.
          examples:
            - - deleted
              - archived
          items: {}
          type:
            - array
            - "null"
      type: object
    JobResponse:
      additionalProperties: false
      properties:
        completedAt:
          description: UTC timestamp when the job reached a terminal state.
          examples:
            - "2026-07-13T12:05:00Z"
          format: date-time
          type: string
        createdAt:
          description: UTC timestamp when the job was created.
          examples:
            - "2026-07-13T12:00:00Z"
          format: date-time
          type: string
        filters:
          additionalProperties:
            additionalProperties:
              additionalProperties:
                $ref: "#/components/schemas/FilterCondition"
              type: object
            type: object
          description: Filter conditions applied to the extraction.
          examples:
            - ledger:
                transactions:
                  status:
                    eq:
                      - approved
          type: object
        id:
          description: Unique identifier of the extraction job.
          examples:
            - 01980a89-21f0-7d7e-a109-564b5c6f53ac
          type: string
        mappedFields:
          additionalProperties:
            additionalProperties:
              items:
                type: string
              type:
                - array
                - "null"
            type: object
          description: Fields requested for extraction, grouped by data source and table.
          examples:
            - ledger:
                transactions:
                  - id
                  - amount
          type: object
        metadata:
          additionalProperties: {}
          description: Caller-defined public metadata stored with the job.
          examples:
            - correlationId: settlement-2026-07-13
              source: payments
          type: object
        requestHash:
          description: SHA-256 digest used to detect idempotent duplicate requests.
          examples:
            - d7a8fbb307d7809469ca9abcb0082e4f8d5651e46d3cdb762d02d0bf37c9e592
          type: string
        resultHmac:
          description: HMAC digest used to verify the result integrity.
          examples:
            - 9dc118e1d4efdcf0f45bb646c38c2a02e9c20b0fc2c75c1a9be0fae200bd9f93
          type: string
        resultPath:
          description: Storage path of the generated extraction result.
          examples:
            - s3://fetcher-results/jobs/01980a89-21f0-7d7e-a109-564b5c6f53ac.json
          type: string
        status:
          description: Current processing status of the job.
          examples:
            - completed
          type: string
      required:
        - id
        - mappedFields
        - status
        - createdAt
      type: object
    SSLInput:
      additionalProperties: false
      properties:
        ca:
          description: PEM-encoded certificate authority used to verify the server.
          examples:
            - |-
              -----BEGIN CERTIFICATE-----
              ...
          type: string
        cert:
          description: Optional PEM-encoded client certificate.
          examples:
            - |-
              -----BEGIN CERTIFICATE-----
              ...
          type:
            - string
            - "null"
        key:
          description: Optional PEM-encoded private key for the client certificate.
          examples:
            - |-
              -----BEGIN PRIVATE KEY-----
              ...
          type:
            - string
            - "null"
        mode:
          description: Driver-specific SSL/TLS mode.
          examples:
            - require
          type: string
      required:
        - mode
        - ca
        - cert
        - key
      type: object
    SSLResponse:
      additionalProperties: false
      properties:
        mode:
          description: Configured driver-specific SSL/TLS mode.
          examples:
            - require
          type: string
      type: object
    SSLUpdateInput:
      additionalProperties: false
      properties:
        ca:
          description: New PEM-encoded certificate authority used to verify the server.
          examples:
            - |-
              -----BEGIN CERTIFICATE-----
              ...
          type: string
        cert:
          description: New PEM-encoded client certificate.
          examples:
            - |-
              -----BEGIN CERTIFICATE-----
              ...
          type: string
        key:
          description: New PEM-encoded private key for the client certificate.
          examples:
            - |-
              -----BEGIN PRIVATE KEY-----
              ...
          type: string
        mode:
          description: New driver-specific SSL/TLS mode.
          examples:
            - require
          type: string
      type: object
    SchemaValidationError:
      additionalProperties: false
      properties:
        dataSourceId:
          description: Datasource configuration name where validation failed.
          examples:
            - midaz_onboarding
          type: string
        field:
          description: Field that could not be found, when applicable.
          examples:
            - external_id
          type: string
        table:
          description: Table or collection where validation failed.
          examples:
            - accounts
          type: string
        type:
          description: Machine-readable validation failure type.
          examples:
            - FIELD_NOT_FOUND
          type: string
      required:
        - type
        - dataSourceId
      type: object
    SchemaValidationRequest:
      additionalProperties: false
      properties:
        mappedFields:
          additionalProperties:
            additionalProperties:
              items:
                type: string
              type:
                - array
                - "null"
            type: object
          description: Maps each datasource configuration name to tables and the fields required from each table.
          examples:
            - midaz_onboarding:
                accounts:
                  - id
                  - name
          type: object
      required:
        - mappedFields
      type: object
    SchemaValidationResponse:
      additionalProperties: false
      properties:
        errors:
          description: Validation failures, omitted when every requested field is valid.
          examples:
            - - dataSourceId: midaz_onboarding
                field: external_id
                table: accounts
                type: FIELD_NOT_FOUND
          items:
            $ref: "#/components/schemas/SchemaValidationError"
          type:
            - array
            - "null"
        message:
          description: Human-readable schema validation result.
          examples:
            - Schema validation completed successfully
          type: string
        status:
          description: Schema validation outcome.
          examples:
            - success
          type: string
      required:
        - status
        - message
      type: object
    TableDetails:
      additionalProperties: false
      properties:
        fields:
          description: Fields discovered in the table or collection.
          examples:
            - - id
              - name
              - created_at
          items:
            type: string
          type:
            - array
            - "null"
        name:
          description: Qualified table or collection name.
          examples:
            - public.accounts
          type: string
      required:
        - name
        - fields
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: JWT bearer token issued by the identity provider.
      scheme: bearer
      type: http
info:
  contact:
    email: contact@lerian.studio
    name: Lerian
    url: https://github.com/LerianStudio/fetcher/discussions
  description: API documentation for the Fetcher Manager component
  license:
    identifier: Elastic-2.0
    name: Elastic License 2.0 (Source Available)
  title: Fetcher Manager API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/fetcher:
    post:
      description: Creates and queues a data extraction job, or returns the existing job for an idempotent duplicate request.
      operationId: create-fetcher-job
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetcherRequest"
        description: Fetcher request payload.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetcherResponse"
          description: Duplicate request; the existing job is returned.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetcherResponse"
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Internal Server Error
      summary: Create a data extraction job
      tags:
        - Fetcher
  /v1/fetcher/{id}:
    get:
      description: Returns a data extraction job by identifier.
      operationId: get-fetcher-job
      parameters:
        - description: Resource identifier.
          in: path
          name: id
          required: true
          schema:
            description: Resource identifier.
            examples:
              - 2f1f35f4-4f50-44f3-a8ab-2772d395f0c2
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Internal Server Error
      summary: Get a data extraction job
      tags:
        - Fetcher
  /v1/management/connections:
    get:
      description: Returns a filtered, paginated list of database connections visible to the optional product. Dynamic metadata filters use query parameters such as metadata.region=br.
      operationId: list-connections
      parameters:
        - description: Product name used for connection isolation.
          in: header
          name: X-Product-Name
          schema:
            examples:
              - midaz
            type: string
        - description: Page number; defaults to 1.
          in: query
          name: page
          schema:
            default: 1
            examples:
              - 1
            type: integer
        - description: Page size; defaults to 10 and is capped at 100.
          in: query
          name: limit
          schema:
            default: 10
            examples:
              - 10
            type: integer
        - description: Sort direction.
          in: query
          name: sortOrder
          schema:
            default: desc
            enum:
              - asc
              - desc
            examples:
              - desc
            type: string
        - description: Database type filter.
          in: query
          name: type
          schema:
            enum:
              - ORACLE
              - SQL_SERVER
              - POSTGRESQL
              - MONGODB
              - MYSQL
            examples:
              - POSTGRESQL
            type: string
        - description: Inclusive creation date in YYYY-MM-DD format.
          in: query
          name: startDate
          schema:
            examples:
              - "2026-01-01"
            type: string
        - description: Inclusive final creation date in YYYY-MM-DD format.
          in: query
          name: endDate
          schema:
            examples:
              - "2026-01-31"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Detail"
          description: Internal Server Error
      summary: List connections
      tags:
        - Connections
    post:
      description: Creates a database connection for the product named by the X-Product-Name header.
      operationId: create-connection
      parameters:
        - description: Product name used for connection isolation.
