name: Release

on:
  push:
    branches: [develop, release-candidate, main]
    # Service releases are tagged v<semver> (matches .releaserc.yml tagFormat "v${version}").
    # The pkg/engine submodule has its own path-prefixed tag line (pkg/engine/v*), cut and
    # pushed by the @semantic-release/exec prepare hook on every release. Matching '**' here
    # re-triggered this workflow on that engine tag, and the service image build failed
    # ("tag is needed when pushing to registry") because no service version is derivable
    # from a pkg/engine/* tag name. Restrict to service tags so engine releases don't re-fire.
    tags: ['v*']

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  pipeline:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-release.yml@v1.46.2
    with:
      enable_changelog: ${{ github.ref == 'refs/heads/main' }}
      release_single_app: true
      app_name_prefix: "fetcher"
      enable_gitops_artifacts: true
      filter_paths: |
        components/manager
        components/worker
      shared_paths: |
        go.mod
        go.sum
        pkg/
        Makefile
      enable_helm_dispatch: true
      helm_chart: "fetcher"
      helm_values_key_mappings: '{"fetcher-manager": "manager", "fetcher-worker": "worker"}'
      gitops_yaml_key_mappings: '{"fetcher-manager.tag": ".manager.image.tag", "fetcher-worker.tag": ".worker.image.tag"}'
    secrets: inherit
