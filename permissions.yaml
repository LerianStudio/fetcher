# Access-Manager RI permission-declaration manifest for fetcher (slug: fetcher).
#
# Under the Access-Manager Responsibility Inversion (RI), fetcher declares its
# own RBAC here instead of having it live centrally in the plugin-access-manager
# Casdoor seed. The platform publishes this manifest (one S3 object per service,
# keyed by the top-level `service:`) for the tenant-manager to reconcile into
# Casdoor.
#
# fetcher enforces authorization: every protected Huma operation runs
# auth.Authorize(applicationName, resource, action) via the lib-auth authorize
# middleware (components/manager/internal/adapters/http/in/routes.go:56-57), wired
# per route through operationMiddlewareFactory. applicationName is the constant
# "fetcher" (routes.go:21). The (resource, action) pairs below are the distinct
# guarded tuples enforced by the route table; actions are the verbatim strings the
# authorizer receives (the repo uses HTTP-verb action strings), NOT invented verbs.
#
# Keys mirror the yaml tags on lib-auth/v4 auth/declaration.DeclarationManifest.
# Everything the central reconciler prefixes is declared BARE here:
#   - resources: bare; the reconciler composes the "{service}/" prefix, so the
#     resulting permission is "{service}/{resource}:{action}".
#   - roles: bare business roles; the reconciler composes "{service}/{name}".
#
# Role grants are NOT inferred: they reproduce, pair for pair, what the
# access-manager seed (caradhras deploy/pam-seed/init_data.json) grants today, so
# a reconcile that replaces the seeded RBAC with this manifest removes nobody's
# access. The seed writes resources x actions as a cartesian product; only the
# pairs with a live route are declared here, and every one of them matches:
#   fetcher-editor-role      (admin-group, fetcher-editor-group) -> admin
#   fetcher-contributor-role (fetcher-contributor-group)         -> operator
#   fetcher-viewer-role      (fetcher-viewer-group)              -> viewer
service: fetcher
# version: REQUIRED by the manifest schema, integer >= 1. Advisory only: it is
# excluded from the canonical content hash, so bumping it with identical content
# is a no-op publish.
version: 1
permissions:
  # connections (components/manager/internal/adapters/http/in/huma_connections.go:457, huma_migration.go:203)
  - { resource: connections, action: get,    effect: allow, roles: [admin, operator, viewer] }
  - { resource: connections, action: post,   effect: allow, roles: [admin, operator] }
  - { resource: connections, action: patch,  effect: allow, roles: [admin, operator] }
  - { resource: connections, action: delete, effect: allow, roles: [admin] }

  # fetcher (components/manager/internal/adapters/http/in/huma_fetcher.go:154)
  - { resource: fetcher, action: get,  effect: allow, roles: [admin, operator, viewer] }
  - { resource: fetcher, action: post, effect: allow, roles: [admin, operator] }

# roles: REQUIRED - every role referenced by a permission above MUST be declared
# here or the reconciler rejects the manifest ("references undeclared role").
# Role names are BARE; the reconciler composes "fetcher/{name}". Groups are BARE
# too (the reconciler composes the "lerian/" owner) and are the seed's groups,
# "-group" suffix included: a name without it makes the reconciler create a new,
# empty group and leave the role with no members.
roles:
  - name: admin
    granted_to:
      - group: fetcher-editor-group
      # seed: fetcher-editor-role -> lerian/admin-group, the platform admin group.
      - group: admin-group
  - name: operator
    granted_to:
      - group: fetcher-contributor-group
  - name: viewer
    granted_to:
      - group: fetcher-viewer-group

# m2m: fetcher's bilateral machine-to-machine contract.
#   exposed: false. No Lerian service calls fetcher over HTTP as an M2M target:
#            Matcher and Reporter embed pkg/engine in-process, and no repo reads
#            a fetcher M2M client (the FETCHER_M2M_* keys still in reporter's
#            gitops values are read by no reporter code, v4.5.0 or develop).
#   needs:   none. fetcher has no outbound M2M client.
m2m:
  exposed: false
